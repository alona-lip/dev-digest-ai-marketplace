name: Validate marketplace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugins
        run: claude plugin validate . --strict

      - name: Check catalog consistency
        run: ./scripts/check-marketplace.sh

      - name: Check plugin portability
        run: ./scripts/check-portability.sh

      - name: Check version bumps
        if: github.event_name == 'pull_request'
        run: ./scripts/check-version-bump.sh "origin/${{ github.base_ref }}"
